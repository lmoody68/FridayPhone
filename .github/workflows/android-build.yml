name: Build Friday Phone APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Vosk English model
        run: |
          set -e
          curl -L --fail -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          rm -rf app/src/main/assets/model-en-us
          mkdir -p app/src/main/assets
          mv vosk-model-small-en-us-0.15 app/src/main/assets/model-en-us
          # Vosk's StorageService.unpack REQUIRES a 'uuid' file in the model dir (it versions the
          # unpacked copy by it). The small model ships WITHOUT one, so unpack throws
          # "model-en-us/uuid" and the app silently falls back to Google SODA (can't hear a ring).
          # Creating it here is the fix.
          echo "vosk-model-small-en-us-0.15" > app/src/main/assets/model-en-us/uuid
          echo "Model contents:" && ls app/src/main/assets/model-en-us

      - name: Fetch Vosk speaker model (voiceprint lock)
        run: |
          set -e
          curl -L --fail -o spk.zip https://alphacephei.com/vosk/models/vosk-model-spk-0.4.zip
          unzip -q spk.zip
          rm -rf app/src/main/assets/model-spk
          mkdir -p app/src/main/assets
          mv vosk-model-spk-0.4 app/src/main/assets/model-spk
          echo "Speaker model contents:" && ls app/src/main/assets/model-spk

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK (non-debuggable — no OS compatibility warning)
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          RELAY_KEY: ${{ secrets.RELAY_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fridayphone-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
